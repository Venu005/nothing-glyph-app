<h2>All pets: every mood, reaction and always-on pose</h2>
<p class="subtitle">One row per pet, drawn by one shared expression system: each pet is a "rig" (body, eye and mouth positions, extras). Big = 25×25, small = 13×13. Click any cell you'd like changed and tell me what in the terminal.</p>
<div style="display:flex;gap:10px;margin:6px 0 14px">
  <button class="mock-button" id="sz">Show 13×13</button>
</div>
<div id="rows"></div>
<p id="err" style="color:#D71921;font-family:monospace;font-size:12px"></p>

<style>
  .petrow{margin:14px 0 22px}
  .petname{font:700 15px ui-monospace,Menlo,monospace;color:#eee;margin-bottom:6px}
  .cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}

  .cell.selected{border-color:#D71921}
  .cell canvas{display:block;margin:0 auto}
  .lbl{color:#999;font:10px ui-monospace,Menlo,monospace;margin-top:4px}
</style>
