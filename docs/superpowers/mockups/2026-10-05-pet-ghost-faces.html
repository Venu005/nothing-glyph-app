<h2>Glyph Pet: the ghost's moods and reactions</h2>
<p class="subtitle">All loops, at 25×25 and 13×13. Resting faces first, then reactions, then tilt and always-on stills. Click any you'd like changed and tell me what in the terminal.</p>

<div id="groups"></div>
<p id="err" style="color:#D71921;font-family:monospace;font-size:12px"></p>

<style>
  .grp{margin:18px 0 6px;font-size:11px;letter-spacing:.1em;color:#999;text-transform:uppercase}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
  .card{background:#0b0b0b;border:1px solid #2a2a2a;border-radius:8px;padding:10px;cursor:pointer}
  .card.selected{border-color:#D71921}
  .pair{display:flex;gap:10px;align-items:flex-end;justify-content:center}
  .nm{color:#eee;font:600 13px ui-monospace,Menlo,monospace;margin-top:8px}
  .ds{color:#888;font:11px ui-monospace,Menlo,monospace;margin-top:2px;line-height:1.35}
</style>

<script>
(function(){
function mask(n,x,y){var c=(n-1)/2;return Math.hypot(x-c,y-c)<=n/2}
function G(n){var g=new Float32Array(n*n);g.n=n;
  g.p=function(x,y,b){x=Math.round(x);y=Math.round(y);if(x<0||y<0||x>=n||y>=n||!mask(n,x,y)||b<=0)return;var i=y*n+x;if(b>g[i])g[i]=Math.min(1,b)};
  g.s=function(x,y,b){x=Math.round(x);y=Math.round(y);if(x<0||y<0||x>=n||y>=n||!mask(n,x,y))return;g[y*n+x]=b};
  return g}
function circ(cx,cy,r){var P=[],x=r,y=0,e=1-r;while(x>=y){[[x,y],[y,x],[-y,x],[-x,y],[-x,-y],[-y,-x],[y,-x],[x,-y]].forEach(function(d){P.push([cx+d[0],cy+d[1]])});y++;if(e<0)e+=2*y+1;else{x--;e+=2*(y-x)+1}}return P}
function line(g,x0,y0,x1,y1,b){var st=Math.max(1,Math.ceil(Math.hypot(x1-x0,y1-y0)*2));for(var k=0;k<=st;k++){var f=k/st;g.p(x0+(x1-x0)*f,y0+(y1-y0)*f,b)}}
function bm(g,rows,x0,y0,b){rows.forEach(function(r,j){for(var i=0;i<r.length;i++)if(r[i]==="1")g.p(x0+i,y0+j,b)})}
var HEART=["101","111","010"],Z=["111","010","111"],BOLT=["01","11","10"];
function float(t,big,amp){return Math.round(Math.sin(t/700)*(big?1:0.6)*(amp==null?1:amp))}

// ── ghost body ── o: dx, dy, b (brightness), puff, hemSpeed (ms per step, 0 = still), droop
function body(g,t,o){var big=g.n>=25,dx=o.dx||0,dy=o.dy||0,b=o.b||0.85,hs=o.hemSpeed==null?200:o.hemSpeed;var step=hs?Math.floor(t/hs):0;
  if(big){var r=o.puff?8:7,L=12-r,R=12+r,top=11;
    circ(12+dx,top+dy,r).forEach(function(p){if(p[1]<=top+dy)g.p(p[0],p[1],b)});
    var bot=19+(o.droop?1:0);line(g,L+dx,top+dy,L+dx,bot+dy,b);line(g,R+dx,top+dy,R+dx,bot+dy,b);
    for(var x=L;x<=R;x++){var w=((x+step)%4<2)?0:1;g.p(x+dx,bot+1+dy+w,b)}}
  else{var r=o.puff?5:4,L=6-r,R=6+r,top=6;
    circ(6+dx,top+dy,r).forEach(function(p){if(p[1]<=top+dy)g.p(p[0],p[1],b)});
    line(g,L+dx,top+dy,L+dx,10+dy,b);line(g,R+dx,top+dy,R+dx,10+dy,b);
    for(var x=L;x<=R;x++){var w=((x+step)%2)?1:0;g.p(x+dx,11+dy-w,b)}}}

// ── eyes ── big: 2×3 at x 9,14 y 10; small: 1 px at x 4,8 y 6
function eyes(g,kind,o){o=o||{};var big=g.n>=25,dx=o.dx||0,dy=o.dy||0,px=o.px||0,py=o.py||0;
  if(big){var ey=10+dy;[9+dx,14+dx].forEach(function(ex){var left=ex<12+dx;
    if(kind==="open"){for(var a=0;a<2;a++)for(var c=0;c<3;c++)g.s(ex+a+px,ey+c+py,1)}
    else if(kind==="blink"||kind==="closed"){g.s(ex,ey+2,1);g.s(ex+1,ey+2,1)}
    else if(kind==="half"){g.s(ex+px,ey+2,1);g.s(ex+1+px,ey+2,1);g.s(ex+px,ey+1,1);g.s(ex+1+px,ey+1,1)}
    else if(kind==="happy"){g.s(ex-1,ey+2,1);g.s(ex,ey+1,1);g.s(ex+1,ey+1,1);g.s(ex+2,ey+2,1)}
    else if(kind==="sad"){if(left){g.s(ex+1,ey+1,1);g.s(ex,ey+2,1);g.s(ex-1,ey+2,0.5)}else{g.s(ex,ey+1,1);g.s(ex+1,ey+2,1);g.s(ex+2,ey+2,0.5)}}
    else if(kind==="swirl"){var ph=Math.floor((o.t||0)/110)%6;var ring=[[0,0],[1,0],[1,1],[1,2],[0,2],[0,1]];ring.forEach(function(d,k){g.s(ex+d[0],ey+d[1],k===ph?0.15:1)})}
    else if(kind==="angry"){for(var a=0;a<2;a++)for(var c=1;c<3;c++)g.s(ex+a,ey+c,1)}
    else if(kind==="wide"){for(var a=-1;a<3;a++)for(var c=-1;c<3;c++)if(!((a===-1||a===2)&&(c===-1||c===2)))g.s(ex+a,ey+c,1)}});
    if(kind==="angry"){g.s(8+dx,9+dy,1);g.s(9+dx,9+dy,1);g.s(10+dx,10+dy,1);g.s(16+dx,9+dy,1);g.s(15+dx,9+dy,1);g.s(14+dx,10+dy,1)}}
  else{var ey=6+dy;[4+dx,8+dx].forEach(function(ex){var left=ex<6+dx;
    if(kind==="open"||kind==="angry"||kind==="wide")g.s(ex+px,ey+py,1);
    else if(kind==="blink"||kind==="closed"||kind==="half")g.s(ex,ey,0.45);
    else if(kind==="happy"){g.s(ex-1,ey,1);g.s(ex,ey-1,1);g.s(ex+1,ey,1)}
    else if(kind==="sad"){g.s(ex,ey,1);g.s(ex+(left?-1:1),ey+1,0.6)}
    else if(kind==="swirl"){var ph=Math.floor((o.t||0)/120)%4;var d=[[0,-1],[1,0],[0,1],[-1,0]][ph];g.s(ex,ey,0.4);g.s(ex+d[0],ey+d[1],1)}});
    if(kind==="angry"){g.s(5+dx,5+dy,1);g.s(7+dx,5+dy,1)}}}
function mouth(g,kind,o){o=o||{};var big=g.n>=25,dx=o.dx||0,dy=o.dy||0;
  var P=big?{small:[[12,15]],smile:[[11,15],[12,16],[13,15]],wide:[[10,15],[11,16],[12,16],[13,16],[14,15]],flat:[[11,15],[12,15],[13,15]],
      frown:[[11,16],[12,15],[13,16]],O:[[11,15],[12,14],[13,15],[11,16],[13,16],[12,17]],zig:[[10,16],[11,15],[12,16],[13,15],[14,16]],chomp:[[11,15],[12,15],[13,15],[11,16],[13,16]],
      ohh:[[12,15],[12,16]]}
    :{small:[[6,8]],smile:[[5,8],[6,9],[7,8]],wide:[[4,8],[5,9],[6,9],[7,9],[8,8]],flat:[[5,8],[6,8],[7,8]],frown:[[5,9],[6,8],[7,9]],O:[[6,8],[5,9],[7,9]],zig:[[5,9],[6,8],[7,9]],chomp:[[5,8],[6,8],[7,8]],ohh:[[6,8]]};
  P[kind].forEach(function(p){g.s(p[0]+dx,p[1]+dy,1)})}
function blush(g,o){o=o||{};var dx=o.dx||0,dy=o.dy||0,v=o.v||0.35;if(g.n>=25){g.p(7+dx,14+dy,v);g.p(17+dx,14+dy,v)}else{g.p(3+dx,8+dy,v);g.p(9+dx,8+dy,v)}}
function hearts(g,t,count){var big=g.n>=25;for(var i=0;i<count;i++){var ph=((t/1300)+i/count)%1;var hx=big?(i%2?20:2):(i%2?11:1);var hy=(big?11:6)-ph*(big?9:5);
  if(big)bm(g,HEART,hx,Math.round(hy),1-ph*0.7);else g.p(hx,Math.round(hy),1-ph*0.7)}}
var blinkAt=function(t,every,dur){return (t%every)<dur};

var S={
 happy:function(g,t){var hop=(t%2600)<500?Math.round(-Math.sin((t%2600)/500*Math.PI)*(g.n>=25?2:1)):float(t,g.n>=25);var o={dy:hop};body(g,t,{dy:hop,hemSpeed:120});eyes(g,"happy",o);mouth(g,"wide",o);blush(g,o)},
 content:function(g,t){var o={dy:float(t,g.n>=25)};body(g,t,o);eyes(g,blinkAt(t,3200,160)?"blink":"open",o);mouth(g,"small",o)},
 bored:function(g,t){var o={dy:float(t,g.n>=25,0.5)};var y=(t%7000)>5800;body(g,t,{dy:o.dy,hemSpeed:450});eyes(g,y?"closed":"half",{dy:o.dy,px:g.n>=25?1:0});mouth(g,y?"O":"flat",o)},
 sad:function(g,t){var sigh=(t%5200)>4300;var o={dy:sigh?1:0};body(g,t,{dy:o.dy,hemSpeed:0,b:0.7,droop:true});eyes(g,"sad",o);mouth(g,"frown",o);
   if(g.n>=25){var tear=(t%2400)/2400;g.p(15,13+tear*4,0.6*(1-tear))}else{var tear=(t%2400)/2400;g.p(9,7+tear*3,0.6*(1-tear))}},
 sleep:function(g,t){var br=0.5+0.25*(0.5+0.5*Math.sin(t/900));var o={dy:float(t,g.n>=25,0.5)};body(g,t,{dy:o.dy,b:br,hemSpeed:600});eyes(g,"closed",o);mouth(g,"small",o);
   var big=g.n>=25;for(var i=0;i<2;i++){var ph=((t/2400)+i*0.5)%1;if(big)bm(g,Z,18+Math.round(ph*3),Math.round(5-ph*5),1-ph);else g.p(10+Math.round(ph),Math.round(2-ph*2),1-ph)}},
 pet:function(g,t){var o={dy:float(t,g.n>=25)};body(g,t,{dy:o.dy,hemSpeed:100});eyes(g,"happy",o);mouth(g,"wide",o);blush(g,{dy:o.dy,v:0.6});hearts(g,t,g.n>=25?3:2)},
 dizzy:function(g,t){var dx=Math.round(Math.sin(t/110)*(g.n>=25?1.4:1));var o={dx:dx,dy:float(t,g.n>=25)};body(g,t,{dx:dx,dy:o.dy,hemSpeed:60});eyes(g,"swirl",{dx:dx,dy:o.dy,t:t});mouth(g,"zig",o)},
 angry:function(g,t){var sh=(Math.floor(t/90)%2)&&(t%1500<500)?1:0;var o={dx:sh};body(g,t,{dx:sh,puff:true,hemSpeed:70});eyes(g,"angry",o);mouth(g,"zig",o);
   var big=g.n>=25;for(var i=0;i<2;i++){var ph=((t/900)+i*0.5)%1;var side=i?1:-1;
     if(big){var x=12+side*(8+ph*3),y=4-ph*4;g.p(x,y,1-ph);g.p(x+side,y,0.7*(1-ph));g.p(x,y-1,0.6*(1-ph))}else{g.p(6+side*(5+ph*1.5),1-ph*2,1-ph)}}},
 calmed:function(g,t){if(t%4000<1600){body(g,t,{hemSpeed:300});eyes(g,"closed");mouth(g,"small");if(g.n>=25){g.s(8,9,1);g.s(9,9,1);g.s(15,9,1);g.s(16,9,1)}}else S.pet(g,t)},
 munch:function(g,t){var big=g.n>=25,c=t%2200;var o={dy:float(t,big)};body(g,t,{dy:o.dy,hemSpeed:120});eyes(g,c>1000?"happy":"open",o);
   if(c<1000){var x=(big?23:12)-c/1000*(big?9:5);if(big)bm(g,BOLT,Math.round(x),14+o.dy,1);else g.p(Math.round(x),8+o.dy,1);mouth(g,"O",o)}
   else{mouth(g,Math.floor(c/180)%2?"chomp":"flat",o);if(big){g.p(16+((c/60)%3),17+o.dy,0.4);g.p(8-((c/80)%2),17+o.dy,0.35)}}},
 peek:function(g,t){var c=t%3200,big=g.n>=25;var off=c<500?Math.round((1-c/500)*(big?14:8)):0;var o={dy:off};body(g,t,{dy:off,hemSpeed:80});eyes(g,c<500?"open":"wide",o);mouth(g,c<500?"small":"O",o);
   if(c>500&&Math.floor(c/250)%2){if(big){for(var y=3;y<=6;y++)g.p(21,y,1);g.p(21,8,1)}else{g.p(11,3,1);g.p(11,5,1)}}},
 yawn:function(g,t){var c=t%3600;var o={dy:float(t,g.n>=25,0.5)};body(g,t,{dy:o.dy,hemSpeed:500});if(c<1800){eyes(g,"closed",o);mouth(g,"O",o)}else{eyes(g,"half",o);mouth(g,"small",o)}},
 boo:function(g,t){var c=t%2600,big=g.n>=25;var grow=c<300;body(g,t,{puff:grow||c<900,hemSpeed:60});eyes(g,"wide");mouth(g,"O")},
 tilt:function(g,t){var a=t/1400,gx=Math.cos(a),gy=Math.sin(a),big=g.n>=25;var px=Math.round(gx),py=Math.round(gy*(big?1:0.6));var lean=Math.round(gx);
   body(g,t,{dx:lean});eyes(g,"open",{dx:lean,px:px,py:py});mouth(g,"small",{dx:lean})},
 aodSleep:function(g){body(g,0,{b:0.55,hemSpeed:0});eyes(g,"closed");mouth(g,"small");if(g.n>=25)bm(g,Z,19,3,0.8);else g.p(10,1,0.8)},
 aodMunch:function(g){body(g,0,{hemSpeed:0});eyes(g,"happy");mouth(g,"chomp");if(g.n>=25)bm(g,BOLT,17,14,1)},
 aodIdle:function(g){body(g,0,{hemSpeed:0});eyes(g,"open",{px:1});mouth(g,"small")},
};
var groups=[
 ["Resting faces",[["happy","Happy","Mood 70–100. Little hops, ^ ^ eyes, blush, quick wavy hem."],["content","Content","Mood 40–69. Floats, blinks."],["bored","Bored","Mood 15–39. Half-lidded side-eye, slow hem, yawns."],["sad","Sad","Mood 0–14. Droopy eyes, still hem, sagging, a tear."],["sleep","Asleep","Sleep hours. Dim breathing glow, slow float, z's."]]],
 ["Reactions",[["pet","Pet (long press)","Squinty eyes, blush, hearts float up."],["dizzy","Dizzy (shake)","Swirly eyes, wobble, frantic hem."],["angry","Angry (3 shakes in 10 s)","Puffs up bigger, angled brows, steam."],["calmed","Calmed (pet while angry)","Hmph… then hearts."],["munch","Munch (charging)","A bolt flies in, chomp chomp, crumbs."],["peek","Peekaboo (face-up again)","Rises up from below, big eyes, blinking !"],["yawn","Wake-up yawn (pet at night)","Big yawn, then sleepy eyes."],["boo","Boo! (bonus)","Puffs up with wide eyes and an O mouth — a little scare for fun."]]],
 ["Tilt & always-on",[["tilt","Tilt","Pupils follow gravity, body drifts 1 px."],["aodIdle","AOD · idle","Still pose by day (eyes look a different way each minute)."],["aodSleep","AOD · asleep","Still pose at night."],["aodMunch","AOD · charging","Still munch pose."]]],
];
var root=document.getElementById("groups"),cells=[];
groups.forEach(function(gr){var h=document.createElement("div");h.className="grp";h.textContent=gr[0];root.appendChild(h);
  var grid=document.createElement("div");grid.className="grid";root.appendChild(grid);
  gr[1].forEach(function(it){var c=document.createElement("div");c.className="card";c.dataset.choice=it[0];c.onclick=function(){toggleSelect(c)};
    c.innerHTML='<div class="pair"><canvas id="a-'+it[0]+'"></canvas><canvas id="b-'+it[0]+'"></canvas></div><div class="nm">'+it[1]+'</div><div class="ds">'+it[2]+'</div>';grid.appendChild(c);cells.push(it[0])})});
function draw(id,g,px){var n=g.n,cv=document.getElementById(id),ctx=cv.getContext("2d");if(cv.width!==n*px){cv.width=cv.height=n*px}
  ctx.fillStyle="#0b0b0b";ctx.fillRect(0,0,cv.width,cv.height);
  for(var y=0;y<n;y++)for(var x=0;x<n;x++){if(!mask(n,x,y))continue;var b=g[y*n+x];ctx.beginPath();ctx.arc(x*px+px/2,y*px+px/2,px*.38,0,7);ctx.fillStyle=b>0?"rgba(255,255,255,"+(0.1+0.9*b)+")":"#1a1a1a";ctx.fill()}}
var t0=performance.now();
function frame(now){var t=Math.max(0,now-t0);cells.forEach(function(id){try{var a=G(25),b=G(13);S[id](a,t);S[id](b,t);draw("a-"+id,a,6);draw("b-"+id,b,8)}catch(e){document.getElementById("err").textContent="Error in "+id+": "+e.message}});requestAnimationFrame(frame)}
requestAnimationFrame(frame);
})();
</script>
